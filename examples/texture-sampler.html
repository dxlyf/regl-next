<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: texture + sampler object</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <div class="hud">
      <h1>Texture + Sampler Object</h1>
      <p>
        WebGL2 的 <code>regl.sampler(...)</code> 与 <code>regl.texture(...)</code>
        解耦；点击画面切换 nearest / linear，观察 sampler 对象对过滤的影响。
      </p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      try {
        const regl = createREGL({
          container: document.body,
          version: 2,
          attributes: { antialias: true }
        })

        const SIZE = 8
        const data = new Uint8Array(SIZE * SIZE * 4)
        for (let y = 0; y < SIZE; ++y) {
          for (let x = 0; x < SIZE; ++x) {
            const i = (y * SIZE + x) * 4
            const even = (x + y) % 2 === 0
            data[i] = even ? 245 : 30
            data[i + 1] = even ? 130 : 60
            data[i + 2] = even ? 45 : 140
            data[i + 3] = 255
          }
        }

        const texture = regl.texture({
          width: SIZE,
          height: SIZE,
          data,
          min: 'nearest',
          mag: 'nearest',
          wrap: 'repeat',
          mipmap: false
        })

        let linear = false
        const sampler = regl.sampler({
          min: 'nearest',
          mag: 'nearest',
          wrap: 'repeat'
        })

        const draw = regl({
          vert: `
            precision mediump float;
            attribute vec2 position;
            attribute vec2 uv;
            uniform float scale;
            varying vec2 vUv;
            void main () {
              gl_Position = vec4(position, 0, 1);
              vUv = uv * scale;
            }
          `,
          frag: `
            precision mediump float;
            uniform sampler2D tex;
            varying vec2 vUv;
            void main () { gl_FragColor = texture2D(tex, vUv); }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]],
            uv: [[0, 0], [2, 0], [0, 2]]
          },
          uniforms: {
            tex: {
              texture,
              sampler
            },
            scale: (context) => 1.6 + 0.6 * Math.sin(context.time * 0.45)
          },
          count: 3,
          depth: { enable: false }
        })

        window.addEventListener('pointerdown', () => {
          linear = !linear
          sampler({
            min: linear ? 'linear' : 'nearest',
            mag: linear ? 'linear' : 'nearest'
          })
        })

        regl.frame(() => {
          regl.clear({ color: [0.03, 0.04, 0.06, 1] })
          draw()
          window.markExampleReady()
        })
      } catch (error) {
        window.showExampleError(error)
      }
    </script>
  </body>
</html>
