<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: WebGPU PoC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <h1>WebGPU PoC</h1>
      <p>
        WebGPU-first 最小闭环：<code>createGPU</code> → texture / sampler /
        uniform buffer → pipeline → bindGroup → render pass → readTexture。
      </p>
      <p>这不是 regl WebGL API 的兼容层，而是独立的后端入口。</p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      ;(async function () {
        try {
          const canvas = document.getElementById('canvas')
          canvas.width = Math.floor(window.innerWidth * devicePixelRatio)
          canvas.height = Math.floor(window.innerHeight * devicePixelRatio)

          if (!navigator.gpu || !window.createWEBGPU) {
            throw new Error('WebGPU is not available in this browser')
          }

          const gpu = await createWEBGPU({ canvas })

          // 8x8 棋盘纹理
          const size = 8
          const data = new Uint8Array(size * size * 4)
          for (let y = 0; y < size; ++y) {
            for (let x = 0; x < size; ++x) {
              const i = (y * size + x) * 4
              const checker = (x + y) & 1
              data[i] = checker ? 255 : 40
              data[i + 1] = checker ? 180 : 80
              data[i + 2] = checker ? 80 : 220
              data[i + 3] = 255
            }
          }
          const texture = gpu.texture({
            width: size,
            height: size,
            data
          })
          const sampler = gpu.sampler({
            magFilter: 'nearest',
            minFilter: 'nearest'
          })
          const uniforms = gpu.buffer({
            data: new Float32Array([0, 0, 0, 0]),
            usage: ['uniform']
          })
          const vertices = gpu.buffer({
            data: new Float32Array([
              -1, -1, 0, 0,
               3, -1, 2, 0,
              -1,  3, 0, 2
            ]),
            usage: ['vertex']
          })

          const wgsl = `
            struct Uniforms {
              time: f32,
              pad0: f32,
              pad1: f32,
              pad2: f32
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;
            @group(0) @binding(1) var tex: texture_2d<f32>;
            @group(0) @binding(2) var samp: sampler;

            struct VSOut {
              @builtin(position) pos: vec4<f32>,
              @location(0) uv: vec2<f32>
            };

            @vertex fn vs_main(
              @location(0) position: vec2<f32>,
              @location(1) uv: vec2<f32>
            ) -> VSOut {
              var out: VSOut;
              out.pos = vec4<f32>(position, 0.0, 1.0);
              out.uv = uv;
              return out;
            }

            @fragment fn fs_main(input: VSOut) -> @location(0) vec4<f32> {
              let c = textureSample(tex, samp, input.uv * 4.0);
              let tint = 0.65 + 0.35 * cos(vec3<f32>(
                u.time, u.time + 2.0, u.time + 4.0
              ));
              return vec4<f32>(c.rgb * tint, 1.0);
            }
          `

          const pipeline = gpu.pipeline({
            code: wgsl,
            format: gpu.format,
            attributes: [
              { format: 'float32x2', stride: 16, offset: 0 },
              { format: 'float32x2', stride: 16, offset: 8 }
            ],
            bindings: [
              { binding: 0, kind: 'uniform' },
              { binding: 1, kind: 'texture' },
              { binding: 2, kind: 'sampler' }
            ]
          })
          const bindGroup = gpu.bindGroup(pipeline, [
            { binding: 0, resource: uniforms },
            { binding: 1, resource: texture },
            { binding: 2, resource: sampler }
          ])

          let started = false
          const frame = (time) => {
            uniforms.write(new Float32Array([time * 0.001, 0, 0, 0]))
            gpu.render(
              { clearColor: [0.015, 0.02, 0.035, 1] },
              (pass) => {
                pass.draw({
                  pipeline,
                  bindGroup,
                  vertexBuffers: [vertices],
                  count: 3
                })
              }
            )
            if (!started) {
              started = true
              window.markExampleReady()
            }
            requestAnimationFrame(frame)
          }
          requestAnimationFrame(frame)
        } catch (error) {
          window.showExampleError(error)
        }
      })()
    </script>
  </body>
</html>
