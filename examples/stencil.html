<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: stencil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <div class="hud">
      <h1>Stencil 模板测试</h1>
      <p>
        先用一个圆形写入 stencil=1（关闭颜色写入），再画全屏渐变，
        只允许 <code>stencil == 1</code> 的像素通过，形成一个动态圆形窗口。
      </p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      try {
        const regl = createREGL({
          container: document.body,
          attributes: { stencil: true }
        })

        const fullscreen = {
          vert: `
            precision mediump float;
            attribute vec2 position;
            varying vec2 vUv;
            void main () {
              vUv = position * 0.5 + 0.5;
              gl_Position = vec4(position, 0, 1);
            }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]]
          },
          count: 3,
          depth: { enable: false }
        }

        const writeStencil = regl({
          ...fullscreen,
          frag: `
            precision mediump float;
            uniform float time;
            uniform float aspect;
            varying vec2 vUv;
            void main () {
              vec2 p = vUv - 0.5;
              p.x *= aspect;
              float radius = 0.3 + 0.025 * sin(time * 2.0);
              if (length(p) > radius) discard;
              gl_FragColor = vec4(1.0);
            }
          `,
          uniforms: {
            time: regl.context('time'),
            aspect: (context) =>
              context.drawingBufferWidth / Math.max(1, context.drawingBufferHeight)
          },
          colorMask: [false, false, false, false],
          stencil: {
            enable: true,
            mask: 0xff,
            func: { cmp: 'always', ref: 1, mask: 0xff },
            opFront: { fail: 'keep', zfail: 'keep', zpass: 'replace' },
            opBack: { fail: 'keep', zfail: 'keep', zpass: 'replace' }
          }
        })

        const drawWindow = regl({
          ...fullscreen,
          frag: `
            precision mediump float;
            uniform float time;
            varying vec2 vUv;
            void main () {
              vec3 color = mix(
                vec3(0.05, 0.12, 0.3),
                vec3(0.95, 0.35, 0.55),
                vUv.x
              );
              color += 0.12 * sin(vUv.y * 45.0 + time * 2.0);
              gl_FragColor = vec4(color, 1.0);
            }
          `,
          uniforms: {
            time: regl.context('time')
          },
          colorMask: [true, true, true, true],
          stencil: {
            enable: true,
            mask: 0x00,
            func: { cmp: 'equal', ref: 1, mask: 0xff },
            opFront: { fail: 'keep', zfail: 'keep', zpass: 'keep' },
            opBack: { fail: 'keep', zfail: 'keep', zpass: 'keep' }
          }
        })

        // 清 stencil 前必须把写掩码恢复为 0xff
        const resetStencil = regl({
          stencil: { enable: true, mask: 0xff },
          colorMask: [true, true, true, true]
        })

        regl.frame(() => {
          resetStencil(() => {
            regl.clear({
              color: [0.02, 0.03, 0.05, 1],
              depth: 1,
              stencil: 0
            })
          })

          writeStencil()
          drawWindow()
          window.markExampleReady()
        })
      } catch (error) {
        window.showExampleError(error)
      }
    </script>
  </body>
</html>
