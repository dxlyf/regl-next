<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: WebGPU WGSL command</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <h1>WebGPU WGSL Command</h1>
      <p>
        <code>createWEBGPU</code> 返回的渲染器本身可调用：
        <code>const draw = gpu({ code, attributes, bindings, count })</code>。
      </p>
      <p>
        WebGPU 没有全局 uniforms；uniform 是 bind group 中的 uniform buffer binding。
        shader 使用 WGSL，不做 GLSL 转译。
      </p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      ;(async function () {
        try {
          const canvas = document.getElementById('canvas')
          canvas.width = Math.floor(window.innerWidth * devicePixelRatio)
          canvas.height = Math.floor(window.innerHeight * devicePixelRatio)

          if (!navigator.gpu || !window.createWEBGPU) {
            throw new Error('WebGPU is not available in this browser')
          }

          const gpu = await createWEBGPU({ canvas })

          const size = 8
          const pixels = new Uint8Array(size * size * 4)
          for (let y = 0; y < size; ++y) {
            for (let x = 0; x < size; ++x) {
              const i = (y * size + x) * 4
              const checker = (x + y) & 1
              pixels[i] = checker ? 255 : 40
              pixels[i + 1] = checker ? 180 : 80
              pixels[i + 2] = checker ? 80 : 220
              pixels[i + 3] = 255
            }
          }

          const texture = gpu.texture({
            width: size,
            height: size,
            data: pixels
          })
          const sampler = gpu.sampler({
            magFilter: 'nearest',
            minFilter: 'nearest'
          })
          const uniform = gpu.buffer({
            data: new Float32Array([0, 0, 0, 0]),
            usage: ['uniform']
          })

          const draw = gpu({
            code: `
              struct U {
                time: f32,
                pad0: f32,
                pad1: f32,
                pad2: f32
              };
              @group(0) @binding(0) var<uniform> u: U;
              @group(0) @binding(1) var tex: texture_2d<f32>;
              @group(0) @binding(2) var samp: sampler;

              struct VSOut {
                @builtin(position) pos: vec4<f32>,
                @location(0) uv: vec2<f32>
              };

              @vertex fn vs_main(
                @location(0) position: vec2<f32>,
                @location(1) uv: vec2<f32>
              ) -> VSOut {
                var out: VSOut;
                out.pos = vec4<f32>(position, 0.0, 1.0);
                out.uv = uv;
                return out;
              }

              @fragment fn fs_main(input: VSOut) -> @location(0) vec4<f32> {
                let c = textureSample(tex, samp, input.uv * 4.0);
                let tint = 0.65 + 0.35 * cos(vec3<f32>(
                  u.time, u.time + 2.0, u.time + 4.0
                ));
                return vec4<f32>(c.rgb * tint, 1.0);
              }
            `,
            format: gpu.format,
            attributes: {
              position: {
                data: new Float32Array([-1, -1, 3, -1, -1, 3]),
                size: 2
              },
              uv: {
                data: new Float32Array([0, 0, 2, 0, 0, 2]),
                size: 2
              }
            },
            bindings: [
              { binding: 0, kind: 'uniform', resource: uniform },
              {
                binding: 1,
                kind: 'texture',
                resource: texture,
                viewDimension: '2d'
              },
              { binding: 2, kind: 'sampler', resource: sampler }
            ],
            count: 3
          })

          gpu.frame(({ time }) => {
            uniform.write(new Float32Array([time, 0, 0, 0]))
            gpu.render(
              { clearColor: [0.015, 0.02, 0.035, 1] },
              (pass) => {
                draw.draw(pass)
              }
            )
            window.markExampleReady()
          })
        } catch (error) {
          window.showExampleError(error)
        }
      })()
    </script>
  </body>
</html>
