<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: framebuffer / postprocess</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <div class="hud">
      <h1>Framebuffer 离屏渲染</h1>
      <p>
        先把旋转三角形画到 256×256 的 framebuffer，再用全屏三角形采样这张
        texture，做反色 + 扫描线后处理。
      </p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      try {
        const regl = createREGL({ container: document.body })

        const SIZE = 256
        const color = regl.texture({
          width: SIZE,
          height: SIZE,
          min: 'linear',
          mag: 'linear'
        })
        const fbo = regl.framebuffer({ color })

        const drawScene = regl({
          framebuffer: fbo,
          viewport: { x: 0, y: 0, width: SIZE, height: SIZE },
          vert: `
            precision mediump float;
            attribute vec2 position;
            uniform float time;
            varying vec2 vUv;
            void main () {
              float s = sin(time), c = cos(time);
              vec2 p = mat2(c, -s, s, c) * position;
              vUv = position * 0.5 + 0.5;
              gl_Position = vec4(p * 0.8, 0, 1);
            }
          `,
          frag: `
            precision mediump float;
            varying vec2 vUv;
            void main () { gl_FragColor = vec4(vUv, 0.65, 1); }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]]
          },
          uniforms: {
            time: regl.context('time')
          },
          count: 3
        })

        const post = regl({
          framebuffer: null,
          vert: `
            precision mediump float;
            attribute vec2 position;
            varying vec2 vUv;
            void main () {
              vUv = position * 0.5 + 0.5;
              gl_Position = vec4(position, 0, 1);
            }
          `,
          frag: `
            precision mediump float;
            uniform sampler2D tex;
            varying vec2 vUv;
            void main () {
              vec4 c = texture2D(tex, vUv);
              float scan = 0.86 + 0.14 * sin(vUv.y * 700.0);
              gl_FragColor = vec4((1.0 - c.rgb) * scan, 1.0);
            }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]]
          },
          uniforms: {
            tex: fbo
          },
          count: 3
        })

        regl.frame(() => {
          regl.clear({ color: [0.02, 0.03, 0.05, 1], framebuffer: fbo })
          drawScene()
          regl.clear({ color: [0.02, 0.03, 0.05, 1] })
          post()
          window.markExampleReady()
        })
      } catch (error) {
        window.showExampleError(error)
      }
    </script>
  </body>
</html>
