<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: WebGL2 MRT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <div class="hud">
      <h1>WebGL2 MRT</h1>
      <p>
        一个 framebuffer 绑定两张颜色纹理；fragment shader 用
        <code>layout(location = 0/1)</code> 输出两个附件，最后分屏显示。
      </p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      try {
        const regl = createREGL({
          container: document.body,
          version: 2
        })

        const SIZE = 256
        const texA = regl.texture({
          width: SIZE,
          height: SIZE,
          min: 'linear',
          mag: 'linear'
        })
        const texB = regl.texture({
          width: SIZE,
          height: SIZE,
          min: 'linear',
          mag: 'linear'
        })
        const fbo = regl.framebuffer({
          color: [texA, texB],
          depth: false
        })

        const drawMrT = regl({
          framebuffer: fbo,
          viewport: { x: 0, y: 0, width: SIZE, height: SIZE },
          vert: `#version 300 es
            in vec2 position;
            out vec2 vUv;
            void main () {
              vUv = position * 0.5 + 0.5;
              gl_Position = vec4(position, 0, 1);
            }
          `,
          frag: `#version 300 es
            precision highp float;
            in vec2 vUv;
            layout(location = 0) out vec4 outA;
            layout(location = 1) out vec4 outB;
            void main () {
              outA = vec4(vUv, 0.6, 1.0);
              outB = vec4(1.0 - vUv, 0.85, 1.0);
            }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]]
          },
          count: 3
        })

        const show = regl({
          framebuffer: null,
          vert: `#version 300 es
            in vec2 position;
            out vec2 vUv;
            void main () {
              vUv = position * 0.5 + 0.5;
              gl_Position = vec4(position, 0, 1);
            }
          `,
          frag: `#version 300 es
            precision highp float;
            uniform sampler2D texA;
            uniform sampler2D texB;
            in vec2 vUv;
            out vec4 fragColor;
            void main () {
              vec4 a = texture(texA, vUv);
              vec4 b = texture(texB, vUv);
              fragColor = vUv.x < 0.5 ? a : b;
            }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]]
          },
          uniforms: {
            texA,
            texB
          },
          count: 3
        })

        regl.frame(() => {
          regl.clear({
            framebuffer: fbo,
            color: [0.02, 0.03, 0.05, 1]
          })
          drawMrT()
          regl.clear({ color: [0.02, 0.03, 0.05, 1] })
          show()
          window.markExampleReady()
        })
      } catch (error) {
        window.showExampleError(error)
      }
    </script>
  </body>
</html>
