<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: scissor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <div class="hud">
      <h1>Scissor 裁剪</h1>
      <p>
        全屏 shader 只在一个动态矩形内生效；矩形由
        <code>scissor.box</code> 控制。点击切换 scissor 开关。
      </p>
      <p id="mode"></p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      try {
        const regl = createREGL({ container: document.body })

        let enabled = true

        const draw = regl({
          vert: `
            precision mediump float;
            attribute vec2 position;
            varying vec2 vUv;
            void main () {
              vUv = position * 0.5 + 0.5;
              gl_Position = vec4(position, 0, 1);
            }
          `,
          frag: `
            precision mediump float;
            varying vec2 vUv;
            void main () {
              vec3 color = mix(
                vec3(0.1, 0.25, 0.55),
                vec3(0.95, 0.55, 0.2),
                vUv.x
              );
              color += 0.18 * sin(vUv.y * 40.0);
              float grid = step(0.97, fract(vUv.x * 20.0)) +
                step(0.97, fract(vUv.y * 20.0));
              color += grid * 0.15;
              gl_FragColor = vec4(color, 1.0);
            }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]]
          },
          count: 3,
          scissor: regl.prop('scissor'),
          depth: { enable: false }
        })

        function updateLabel () {
          document.getElementById('mode').textContent =
            'scissor: ' + (enabled ? 'ON' : 'OFF')
        }
        updateLabel()

        // 清除时先关闭 scissor，否则 clear 会被上一帧的裁剪框限制
        const clearScreen = regl({
          scissor: { enable: false }
        })

        window.addEventListener('pointerdown', () => {
          enabled = !enabled
          updateLabel()
        })

        regl.frame(({ viewportWidth, viewportHeight, time }) => {
          clearScreen(() => {
            regl.clear({ color: [0.02, 0.03, 0.05, 1] })
          })

          const width = viewportWidth * (0.32 + 0.08 * Math.sin(time * 0.8))
          const height = viewportHeight * (0.42 + 0.1 * Math.cos(time * 0.7))
          const x = (viewportWidth - width) * (0.5 + 0.35 * Math.sin(time * 0.5))
          const y = (viewportHeight - height) * (0.5 + 0.35 * Math.cos(time * 0.4))

          draw({
            scissor: {
              enable: enabled,
              box: { x, y, width, height }
            }
          })
          window.markExampleReady()
        })
      } catch (error) {
        window.showExampleError(error)
      }
    </script>
  </body>
</html>
