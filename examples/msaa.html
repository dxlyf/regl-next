<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>regl-next: WebGL2 MSAA resolve</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="example">
    <div class="hud">
      <h1>WebGL2 MSAA Resolve</h1>
      <p>
        先渲染到 <code>samples: 4</code> 的多重采样 framebuffer，再用
        <code>regl.blitFramebuffer</code> resolve 到普通 texture，最后显示。
      </p>
      <p id="stats"></p>
    </div>

    <script src="../dist/regl-next.iife.js"></script>
    <script src="ui.js"></script>
    <script>
      try {
        const regl = createREGL({
          container: document.body,
          version: 2,
          attributes: { antialias: false }
        })

        const SIZE = 512
        const samples = Math.min(4, regl.limits.maxSamples || 1)

        const msaa = regl.framebuffer({
          width: SIZE,
          height: SIZE,
          samples: samples,
          depth: true
        })
        const resolveTexture = regl.texture({
          width: SIZE,
          height: SIZE,
          min: 'linear',
          mag: 'linear'
        })
        const resolve = regl.framebuffer({
          color: resolveTexture,
          depth: false
        })

        const scene = regl({
          framebuffer: msaa,
          viewport: { x: 0, y: 0, width: SIZE, height: SIZE },
          vert: `
            precision mediump float;
            attribute vec2 position;
            uniform float angle;
            uniform vec2 offset;
            void main () {
              float s = sin(angle), c = cos(angle);
              vec2 p = mat2(c, -s, s, c) * position + offset;
              gl_Position = vec4(p, 0, 1);
            }
          `,
          frag: `
            precision mediump float;
            uniform vec4 color;
            void main () { gl_FragColor = color; }
          `,
          attributes: {
            position: [[-0.9, -0.055], [0.9, -0.055], [0, 0.055]]
          },
          uniforms: {
            angle: regl.prop('angle'),
            offset: regl.prop('offset'),
            color: regl.prop('color')
          },
          depth: { enable: false },
          count: 3
        })

        const display = regl({
          framebuffer: null,
          vert: `
            precision mediump float;
            attribute vec2 position;
            attribute vec2 uv;
            varying vec2 vUv;
            void main () {
              vUv = uv;
              gl_Position = vec4(position, 0, 1);
            }
          `,
          frag: `
            precision mediump float;
            uniform sampler2D tex;
            varying vec2 vUv;
            void main () { gl_FragColor = texture2D(tex, vUv); }
          `,
          attributes: {
            position: [[-1, -1], [3, -1], [-1, 3]],
            uv: [[0, 0], [2, 0], [0, 2]]
          },
          uniforms: { tex: resolveTexture },
          count: 3,
          depth: { enable: false }
        })

        document.getElementById('stats').textContent =
          'samples: ' + samples + ' · resolve: ' + SIZE + '×' + SIZE

        regl.frame(({ time }) => {
          regl.clear({
            framebuffer: msaa,
            color: [0.02, 0.03, 0.05, 1],
            depth: 1
          })

          const colors = [
            [1.0, 0.3, 0.2, 1.0],
            [0.25, 0.85, 0.95, 1.0],
            [0.9, 0.75, 0.2, 1.0],
            [0.75, 0.35, 1.0, 1.0]
          ]
          for (let i = 0; i < 4; ++i) {
            scene({
              angle: time * 0.35 + i * 0.55,
              offset: [0, (i - 1.5) * 0.28],
              color: colors[i]
            })
          }

          regl.blitFramebuffer({
            src: msaa,
            dst: resolve,
            mask: 'color',
            filter: 'nearest'
          })

          regl.clear({ color: [0.01, 0.015, 0.025, 1] })
          display()
          window.markExampleReady()
        })
      } catch (error) {
        window.showExampleError(error)
      }
    </script>
  </body>
</html>
